<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ERROR 404</title>

        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                font-family: Arial, Helvetica, sans-serif;
            }

            body {
                background: linear-gradient(135deg, #352507, #412a14, #661405);
                min-height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 30px;
            }

            .container {
                width: 100%;
                max-width: 1200px;
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            .form {
                text-align: center;
            }

            h1 {
                font-family: Verdana, Geneva, Tahoma, sans-serif;
                color: rgb(223, 201, 193);
                margin-bottom: 30px;
                font-size: 38px;
            }

            label {
                font-family: Verdana, Geneva, Tahoma, sans-serif;
                color: rgb(223, 201, 193);
                display: block;
                margin-top: 12px;
                margin-bottom: 6px;
                font-size: 18px;
            }

            .form h1,
            .form label,
            .form img {
                opacity: 0;
                transform: translateY(50px);
                animation: subir 1s ease-out forwards;
            }

            .form label {
                animation-delay: 0.3s;
            }

            @keyframes subir {
                from {
                    opacity: 0;
                    transform: translateY(70px);
                }
            

                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
        </style>
    </head>
    <body>
        <div class="form">
            <img src="../imgs/error.png" alt="Erro 404" width="300">
            <h1>Error 404</h1>
            <label>Lamentamos, houve um erro ao acessar a comunicação para requerimento da página!</label>
        </div>
    </body>
</html>
