<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #352507, #975416, #9b2611);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 90px 30px 30px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            text-align: center;
            color: rgb(223, 201, 193);
            margin-bottom: 30px;
            font-size: 38px;
        }

        .TabMenu {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background-color: #241708;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .TabMenu nav {
            display: flex;
            gap: 40px;
        }

        .TabMenu a {
            color: rgb(223, 201, 193);
            text-decoration: none;
            font-size: 18px;
            padding: 20px 15px;
        }

        .TabMenu a:hover {
            color: white;
            background-color: #5c3212;
        }

        .lista {
            width: 100%;
            margin-top: 10px;
            padding: 25px;
        }

        .lista h2 {
            color: rgb(223, 201, 193);
            margin-bottom: 20px;
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            color: rgb(223, 201, 193);
        }

        th {
            background-color: #5c3212;
            color: white;
            padding: 15px;
            text-align: center;
        }

        td {
            padding: 13px;
            text-align: center;
            border-bottom: 1px solid rgba(223, 201, 193, 0.2);
        }

        tbody tr:hover {
            background-color: rgba(151, 84, 22, 0.4);
        }

        .vazio {
            text-align: center;
            padding: 25px;
            color: rgb(223, 201, 193);
        }

        .erro {
            text-align: center;
            padding: 25px;
            color: #ff8f8f;
        }
    </style>
</head>
<body>

    <header class="TabMenu">
        <nav>
            <a href="/about">Sobre</a>
            <a href="/">Menu</a>
        </nav>
    </header>

    <div class="container">
        <h1>Histórico</h1>
        <div class="lista">
            <h2>Histórico total</h2>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Data</th>
                        <th>Temperatura</th>
                        <th>Dilatação</th>
                        <th>Classificação</th>
                    </tr>
                </thead>

                <tbody id="historico"></tbody>
            </table>
        </div>
    </div>

    <script>
        async function carregarHistorico() {
            const tabela = document.getElementById('historico');

            try {
                const resposta = await fetch('/hist');

                if (!resposta.ok) {
                    throw new Error('Erro ao buscar histórico.');
                }

                const hists = await resposta.json();

                tabela.innerHTML = '';

                if (hists.length === 0) {
                    tabela.innerHTML = `
                        <tr>
                            <td colspan="5" class="vazio">
                                Nenhum registro encontrado.
                            </td>
                        </tr>
                    `;
                    return;
                }

                hists.forEach(dado => {
                    const linha = document.createElement('tr');

                    linha.innerHTML = `
                        <td>${dado.id}</td>
                        <td>${dado.data}</td>
                        <td>${dado.temperatura} °C</td>
                        <td>${dado.dilatacao}</td>
                        <td>${dado.classificacao}</td>
                    `;

                    tabela.appendChild(linha);
                });
            } catch (erro) {
                console.error('Erro ao carregar histórico:', erro);

                tabela.innerHTML = `
                    <tr>
                        <td colspan="5" class="erro">
                            Não foi possível carregar o histórico.
                        </td>
                    </tr>
                `;
            }
        }

        carregarHistorico();
    </script>

</body>
</html>
